<!-- BARRA DE OFERTA · reemplaza la franja de beneficios de Shopify. Se desplaza sola (solo CSS, sin scripts).
     {{PCT}} = descuento del Plan Élite frente a 4 cajas sueltas; lo calcula build.py -->
<div class="epb" role="region" aria-label="Oferta">
  <p class="epb-sr">Oferta hasta {{PCT}} % de descuento. Pagas al recibir. Envío gratis.</p>
  <div class="epb-track" aria-hidden="true">
    {{ITEMS}}
  </div>
</div>
<style>
  .epb{position:relative;overflow:hidden;background:#e00000;border-bottom:2px solid #ffd400;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;line-height:1}
  .epb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}
  .epb-track{display:flex;width:max-content;animation:epb-move 22s linear infinite}
  .epb-item{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;white-space:nowrap;color:#fff;font-size:14px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
  .epb-item b{background:#ffd400;color:#111;padding:4px 8px;border-radius:6px;font-weight:900}
  .epb-item i{font-style:normal;color:#ffd400}
  .epb-dot{color:#ffd400;font-size:12px}
  @keyframes epb-move{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.epb-track{animation:none;width:auto;justify-content:center;flex-wrap:wrap}.epb-track .epb-dup{display:none}}
</style>
